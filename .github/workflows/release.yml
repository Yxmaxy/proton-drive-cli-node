name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.8.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body: |
            Node.js build of Proton Drive CLI `${{ inputs.tag || github.ref_name }}` (see `dist/VERSION` for the upstream commit).

            Download `proton-drive.mjs`, run `npm install better-sqlite3` next to it, then `node proton-drive.mjs help`.
          files: |
            dist/proton-drive.mjs
            dist/VERSION
